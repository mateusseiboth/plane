[install]
production = false

[test]
timeout = 30_000

[bundle]
target = "bun"

# Path aliases — espelham o tsconfig para o Bun resolver nativamente
[alias]
"@" = "./src"
"@db" = "./src/db.ts"
"@generated" = "./generated"
"@tests" = "./tests"
"@scripts" = "./scripts"
# Só para os testes: conferem que o chat usa as mesmas ações do catálogo do api-ts.
"@api-ts" = "../api-ts/src"
# O catálogo do api-ts importa `@utils/acoes-do-chat`: o alias de lá, só para os testes.
"@utils" = "../api-ts/src/utils"
