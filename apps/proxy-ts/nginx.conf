worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout 65;
  client_max_body_size 50M;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  upstream api_ts {
    server api-ts:8001;
  }
  upstream web_app {
    server web:3000;
  }
  upstream admin_app {
    server admin:3000;
  }
  # NB: the chat backend is NOT a static `upstream` — it's resolved dynamically at
  # request time (see the resolver + $chat_upstream variable in the chat
  # locations) so recreating the chat-backend container (new IP) never 502s.

  # WebSocket upgrade map (used by the chat WS location).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # ── Auth endpoints → TypeScript API ─────────────────────────────────────
    location ~ ^/auth/ {
      proxy_pass http://api_ts;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }

    # ── Realtime SSE stream → TypeScript API (no buffering, long-lived) ──────
    # Must precede the generic /api locations. Streams server-sent events, so
    # response buffering and short read timeouts have to be disabled.
    location ~ ^/api/(?:v1/)?workspaces/[^/]+/realtime/stream/ {
      rewrite ^/api/(?:v1/)?(.*)$ /api/v1/$1 break;
      proxy_pass http://api_ts;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      chunked_transfer_encoding off;
    }

    # ── API v1 → TypeScript API (direct) ────────────────────────────────────
    location ~ ^/api/v1/ {
      proxy_pass http://api_ts;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }

    # ── /api/* → rewrite to /api/v1/* → TypeScript API ──────────────────────
    location ~ ^/api/(.*) {
      rewrite ^/api/(.*)$ /api/v1/$1 break;
      proxy_pass http://api_ts;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }

    # ── Chat plugin: WebSocket (upgrade, long-lived) ─────────────────────────
    location = /chat-ws {
      # Docker embedded DNS; resolve chat-backend per-request via a variable so a
      # recreated container (new IP) is picked up without restarting the proxy.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $chat_upstream chat-backend:8002;
      # $is_args$args forwards the query string (?workspace=..., ?ticket=...).
      # Without this, nginx strips query params when proxy_pass uses a variable
      # combined with an explicit URI path.
      proxy_pass http://$chat_upstream/ws$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ── Chat plugin: REST API (strip /chat-api prefix) ───────────────────────
    location /chat-api/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $chat_upstream chat-backend:8002;
      rewrite ^/chat-api/(.*)$ /$1 break;
      proxy_pass http://$chat_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      client_max_body_size 50M;
    }

    # ── God-mode admin panel ─────────────────────────────────────────────────
    location /god-mode {
      return 301 /god-mode/;
    }
    location ~ ^/god-mode/ {
      proxy_pass http://admin_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Cookie $http_cookie;
    }

    # ── Main web app ─────────────────────────────────────────────────────────
    location / {
      proxy_pass http://web_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
    }
  }
}
