worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout 65;
  client_max_body_size 50M;

  # Log format
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  upstream api_ts {
    server api-ts:8001;
  }
  upstream web_app {
    server web:3000;
  }
  upstream admin_app {
    server admin:3000;
  }
  upstream space_app {
    server space:3000 max_fails=3 fail_timeout=10s;
  }
  upstream live_app {
    server live:3000 max_fails=3 fail_timeout=10s;
  }
  upstream minio {
    server plane-minio:9000;
  }

  server {
    listen 80;
    server_name _;

    # ── Static file uploads (MinIO) ──────────────────────────────────────────
    location ~ ^/(uploads)/ {
      proxy_pass http://minio;
      proxy_set_header Host $host;
      proxy_buffering off;
    }

    # ── Auth endpoints → TypeScript API ─────────────────────────────────────
    location ~ ^/auth/ {
      proxy_pass http://api_ts;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }

    # ── API v1 → TypeScript API (direct) ────────────────────────────────────
    location ~ ^/api/v1/ {
      proxy_pass http://api_ts;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }

    # ── /api/* → rewrite to /api/v1/* → TypeScript API ──────────────────────
    # This makes the frontend's /api/workspaces/ calls hit /api/v1/workspaces/
    location ~ ^/api/(.*) {
      rewrite ^/api/(.*)$ /api/v1/$1 break;
      proxy_pass http://api_ts;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }

    # ── God-mode admin panel ─────────────────────────────────────────────────
    location /god-mode {
      return 301 /god-mode/;
    }
    location ~ ^/god-mode/ {
      proxy_pass http://admin_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Cookie $http_cookie;
    }

    # ── Spaces ───────────────────────────────────────────────────────────────
    location /spaces {
      return 301 /spaces/;
    }
    location ~ ^/spaces/ {
      proxy_pass http://space_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Cookie $http_cookie;
    }

    # ── Live collaboration ───────────────────────────────────────────────────
    location ~ ^/live/ {
      proxy_pass http://live_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # ── Main web app ─────────────────────────────────────────────────────────
    location / {
      proxy_pass http://web_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      # Next.js HMR WebSocket
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
