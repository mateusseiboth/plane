worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout 65;
  client_max_body_size 50M;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # NENHUM serviço usa `upstream` estático: o nginx resolveria o nome uma única
  # vez, no boot, e qualquer `docker compose up --force-recreate` (todo deploy)
  # daria um IP novo ao container — o proxy continuaria batendo no antigo e
  # devolvendo 502 até alguém reiniciar o proxy na mão.
  # Com resolver + variável no proxy_pass, o nome é resolvido a cada requisição.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # WebSocket upgrade map (used by the chat WS location).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # ── Auth endpoints → TypeScript API ─────────────────────────────────────
    location ~ ^/auth/ {
      set $api_upstream api-ts:8001;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }

    # ── Realtime SSE stream → TypeScript API (no buffering, long-lived) ──────
    # Must precede the generic /api locations. Streams server-sent events, so
    # response buffering and short read timeouts have to be disabled.
    location ~ ^/api/(?:v1/)?workspaces/[^/]+/realtime/stream/ {
      # `set` antes do rewrite (o `break` encerra a fase e o `set` não rodaria) e
      # `$uri` no proxy_pass (com upstream em variável o nginx manda a URI
      # ORIGINAL e ignora o rewrite). Sem os dois, o SSE respondia 500.
      set $api_upstream api-ts:8001;
      rewrite ^/api/(?:v1/)?(.*)$ /api/v1/$1 break;
      proxy_pass http://$api_upstream$uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      chunked_transfer_encoding off;
    }

    # ── API v1 → TypeScript API (direct) ────────────────────────────────────
    location ~ ^/api/v1/ {
      set $api_upstream api-ts:8001;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }

    # ── /api/* → rewrite to /api/v1/* → TypeScript API ──────────────────────
    location ~ ^/api/(.*) {
      # O `set` precisa vir ANTES do rewrite: `break` encerra a fase de rewrite e
      # o `set` (que é dessa fase) não chegaria a rodar — a variável ficava vazia
      # e o nginx respondia 500 "no host in upstream".
      set $api_upstream api-ts:8001;
      rewrite ^/api/(.*)$ /api/v1/$1 break;
      # $uri$is_args$args é OBRIGATÓRIO aqui: com upstream em variável e sem URI
      # no proxy_pass, o nginx manda a URI ORIGINAL e ignora o rewrite acima —
      # /api/instances/ chegava assim na API (que só conhece /api/v1/...) e o
      # frontend caía na tela de "instância não iniciada".
      proxy_pass http://$api_upstream$uri$is_args$args;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }

    # ── Chat plugin: WebSocket (upgrade, long-lived) ─────────────────────────
    location = /chat-ws {
      # Docker embedded DNS; resolve chat-backend per-request via a variable so a
      # recreated container (new IP) is picked up without restarting the proxy.
      set $chat_upstream chat-backend:8002;
      # $is_args$args forwards the query string (?workspace=..., ?ticket=...).
      # Without this, nginx strips query params when proxy_pass uses a variable
      # combined with an explicit URI path.
      proxy_pass http://$chat_upstream/ws$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ── Chat plugin: REST API (strip /chat-api prefix) ───────────────────────
    location /chat-api/ {
      set $chat_upstream chat-backend:8002;
      rewrite ^/chat-api/(.*)$ /$1 break;
      proxy_pass http://$chat_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      client_max_body_size 50M;
    }

    # ── God-mode admin panel ─────────────────────────────────────────────────
    location /god-mode {
      return 301 /god-mode/;
    }
    location ~ ^/god-mode/ {
      set $admin_upstream admin:3000;
      proxy_pass http://$admin_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Cookie $http_cookie;
    }

    # ── Main web app ─────────────────────────────────────────────────────────
    location / {
      set $web_upstream web:3000;
      proxy_pass http://$web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
    }
  }
}
