services:
  plane-redis:
    container_name: plane-plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  plane-db:
    container_name: plane-plane-db
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"

  plane-minio:
    container_name: plane-plane-minio
    image: minio/minio
    restart: unless-stopped
    networks:
      - dev_env
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME:-uploads} &&
      minio server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 ${AWS_ACCESS_KEY_ID:-access-key} ${AWS_SECRET_ACCESS_KEY:-secret-key} &&
      mc mb myminio/${AWS_S3_BUCKET_NAME:-uploads} -p || true
      && tail -f /dev/null
      "
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}
    ports:
      - "9000:9000"
      - "9090:9090"

  db-migrate:
    container_name: plane-db-migrate
    build:
      context: ./apps/api-ts
      dockerfile: Dockerfile.dev
    restart: "no"
    networks:
      - dev_env
    command: ["bunx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
    depends_on:
      - plane-db

  seeder:
    container_name: plane-seeder
    build:
      context: ./apps/api-ts
      dockerfile: Dockerfile
    restart: "no"
    networks:
      - dev_env
    command: ["bun", "run", "scripts/seed.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@plane.so}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      WORKSPACE_SLUG: ${WORKSPACE_SLUG:-quality}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Quality}
      # Set to true once to re-apply the code's role visibility/transition defaults
      # to existing system roles (e.g. after changing board-visibility rules).
      RESEED_WORKFLOW: ${RESEED_WORKFLOW:-false}
    depends_on:
      - plane-db

  api-ts:
    container_name: plane-api-ts
    build:
      context: ./apps/api-ts
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    networks:
      - dev_env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
      PORT: 8001
      NODE_ENV: development
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000
      JWT_SECRET: ${SECRET_KEY:-plane-jwt-secret}
      # IA de levantamento de requisitos ("texto fantasma"). Sem URL o recurso
      # fica desligado e escrever chamado segue igual. A credencial nunca vai
      # para o navegador: fica só aqui. Detalhes em .claude/DEPLOY.md.
      IA_REQUISITOS_URL: ${IA_REQUISITOS_URL:-}
      IA_REQUISITOS_FORMATO: ${IA_REQUISITOS_FORMATO:-aviao}
      IA_REQUISITOS_CHAVE: ${IA_REQUISITOS_CHAVE:-}
      IA_REQUISITOS_MODELO: ${IA_REQUISITOS_MODELO:-}
      IA_REQUISITOS_TIMEOUT_MS: ${IA_REQUISITOS_TIMEOUT_MS:-2000}
      IA_REQUISITOS_ENABLED: ${IA_REQUISITOS_ENABLED:-true}
      IA_REQUISITOS_OCR_URL: ${IA_REQUISITOS_OCR_URL:-}
      IA_REQUISITOS_OCR_TIMEOUT_MS: ${IA_REQUISITOS_OCR_TIMEOUT_MS:-1500}
    depends_on:
      - plane-db
      - plane-redis
    ports:
      - "8001:8001"

  # ── Chat plugin backend (own service, shares the Plane DB by default) ──────
  chat-migrate:
    container_name: plane-chat-migrate
    build:
      context: ./apps/chat-backend
      dockerfile: Dockerfile
    restart: "no"
    networks:
      - dev_env
    command: ["bun", "run", "scripts/migrate.ts"]
    environment:
      # Shares the Plane Postgres (chat_* tables). Set CHAT_DATABASE_URL only to
      # point the chat plugin at a separate database.
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
    depends_on:
      - plane-db

  chat-backend:
    container_name: plane-chat-backend
    build:
      context: ./apps/chat-backend
      dockerfile: Dockerfile
    # Hot-reload: source files are mounted so code changes are picked up
    # automatically without rebuilding the container (bun --watch fully restarts
    # the process on any file change, which is safer for a WS server).
    command: ["bun", "run", "--watch", "src/index.ts"]
    volumes:
      - ./apps/chat-backend/src:/app/src
      # Anexos do chat gravados em disco. Sem este volume os arquivos ficam na
      # camada gravável do container e somem em qualquer recriação — inclusive
      # nos `docker compose run --rm` usados pelos importadores.
      - chatmedia:/app/media
    restart: unless-stopped
    networks:
      - dev_env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
      CHAT_PORT: 8002
      JWT_SECRET: ${SECRET_KEY:-plane-jwt-secret}
      NODE_ENV: development
      # Public base for media links forwarded to WhatsApp (Z-API needs a URL).
      CHAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-http://localhost/chat-api}
      # Optional S3 for chat media (else local disk):
      CHAT_S3_ENDPOINT: ${CHAT_S3_ENDPOINT:-}
      CHAT_S3_REGION: ${CHAT_S3_REGION:-}
      CHAT_S3_BUCKET: ${CHAT_S3_BUCKET:-}
      CHAT_S3_ACCESS_KEY: ${CHAT_S3_ACCESS_KEY:-}
      CHAT_S3_SECRET_KEY: ${CHAT_S3_SECRET_KEY:-}
    depends_on:
      - plane-db
      - chat-migrate
    ports:
      - "8002:8002"

  proxy:
    container_name: plane-proxy
    build:
      context: ./apps/proxy-ts
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dev_env
    depends_on:
      - api-ts
      - web
      - chat-backend
    ports:
      - "80:80"

  web:
    container_name: plane-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile.web.local
    restart: unless-stopped
    networks:
      - dev_env
    ports:
      - "3000:3000"

  admin:
    container_name: plane-admin
    build:
      context: ./apps/admin
      dockerfile: Dockerfile.admin.local
    restart: unless-stopped
    networks:
      - dev_env
    ports:
      - "3001:3000"

  # On-demand password reset. Does NOT run on a normal `docker compose up` (gated
  # behind the "tools" profile). Run it explicitly:
  #   RESET_EMAIL=fulano@empresa.com RESET_PASSWORD=novaSenha \
  #     docker compose -f docker-compose-local.yml --profile tools run --rm password-reset
  #   # or reset everyone back to the default:
  #   RESET_ALL=true docker compose -f docker-compose-local.yml --profile tools run --rm password-reset
  password-reset:
    container_name: plane-password-reset
    build:
      context: ./apps/api-ts
      dockerfile: Dockerfile
    restart: "no"
    profiles: ["tools"]
    networks:
      - dev_env
    command: ["bun", "run", "scripts/reset-password.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
      RESET_EMAIL: ${RESET_EMAIL:-}
      RESET_ALL: ${RESET_ALL:-false}
      RESET_PASSWORD: ${RESET_PASSWORD:-teste}
      INCLUDE_ADMINS: ${INCLUDE_ADMINS:-false}
      KEEP_AUTOSET: ${KEEP_AUTOSET:-false}
      DRY_RUN: ${DRY_RUN:-false}
    depends_on:
      - plane-db

  sac-migrator:
    container_name: plane-sac-migrator
    build:
      context: ./apps/api-ts
      dockerfile: Dockerfile
    restart: "no"
    networks:
      - dev_env
    command: ["bun", "run", "scripts/migrate-sac.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-plane}
      MYSQL_HOST: ${MYSQL_HOST:-10.1.2.32}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-developer}
      MYSQL_PASS: ${MYSQL_PASS:-qualitydev}
      MYSQL_DB: ${MYSQL_DB:-quality_site_dev}
      WORKSPACE_SLUG: ${WORKSPACE_SLUG:-quality}
      DRY_RUN: ${DRY_RUN:-false}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      LIMIT_RECORDS: ${LIMIT_RECORDS:-0}
      SKIP_COMMENTS: ${SKIP_COMMENTS:-false}
      SKIP_VISITS: ${SKIP_VISITS:-false}
    depends_on:
      - plane-db

volumes:
  redisdata:
  uploads:
  pgdata:
  chatmedia:

networks:
  dev_env:
    driver: bridge
