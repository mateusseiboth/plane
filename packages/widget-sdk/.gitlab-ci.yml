image: node:22-alpine

stages:
  - typecheck
  - build
  - publish

variables:
  NPM_REGISTRY: "http://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"

# ── Template base: cache + install ───────────────────────────────────────────

.base:
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules/
    policy: pull-push
  before_script:
    - npm install --frozen-lockfile

# ── Typecheck ─────────────────────────────────────────────────────────────────

typecheck:
  extends: .base
  stage: typecheck
  script:
    - npm run typecheck

# ── Build ─────────────────────────────────────────────────────────────────────

build:
  extends: .base
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# ── Publish ───────────────────────────────────────────────────────────────────

publish:
  extends: .base
  stage: publish
  needs:
    - job: build
      artifacts: true
  script:
    - |
      echo "@qualitysistemas:registry=${NPM_REGISTRY}" > .npmrc
      echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish --access public
  environment:
    name: npm-registry
    url: http://${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/-/packages
